name: Build Amami GT app icons
on:
  push:
    branches: [main]
    paths:
      - 'amami-gt-icon-source.png'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate PWA icons
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Path('amami-gt-icon-source.png')
          if not src.exists():
              raise SystemExit('Upload amami-gt-icon-source.png first')
          with Image.open(src) as original:
              im=original.convert('RGBA')
              for size in (180,192,512):
                  im.resize((size,size),Image.Resampling.LANCZOS).save(f'amami-gt-icon-{size}.png',optimize=True)
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amami-gt-icon-180.png amami-gt-icon-192.png amami-gt-icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate PWA icons from approved source"
            git push
          fi
