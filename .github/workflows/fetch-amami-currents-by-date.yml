name: Fetch Amami currents by date (test)
on:
  workflow_dispatch:
    inputs:
      day:
        description: 'UTC date (YYYY-MM-DD)'
        required: true
        type: string
        default: '2026-11-14'
permissions:
  contents: write
concurrency:
  group: amami-currents-archive
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install copernicusmarine numpy xarray netCDF4
      - name: Fetch requested day
        env:
          TARGET_DAY: ${{ inputs.day }}
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUS_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUS_PASSWORD }}
        run: python scripts/fetch_amami_currents_by_date.py "$TARGET_DAY"
      - name: Archive only generated current data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/amami-currents-*.json
          if ! git diff --cached --quiet; then
            git commit -m "data: archive requested Amami current day"
            git push
          fi
