<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>奄美GTフィールドノート v0.6</title><style>body{background:#071b28;color:#eef8fc;font-family:system-ui,sans-serif;padding:18px;line-height:1.7}</style></head>
<body><p id="status">🛰️ 地図の航空写真切り替え機能を読み込み中…</p>
<script>
(async()=>{
 const response=await fetch('./amami-gt-cloud-points-v05.html',{cache:'no-store'});
 if(!response.ok)throw Error('v0.5を取得できませんでした');
 let html=await response.text();
 const patches=[[".coord{font-weight:600;color:#a0f4da;overflow-wrap:anywhere}",".map-mode-tools{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}\n.map-mode-tools button{flex:1;min-width:110px;padding:11px 9px;border:1px solid #78b8cb;border-radius:9px;background:#19495c;color:#fff;font-size:14px;font-weight:700}\n.map-mode-tools button.active{background:#42d6b0;color:#062e2b;border-color:#42d6b0}\n.photo-note{font-size:12px;color:#c0dfef;line-height:1.5;margin:8px 0}\n\n.coord{font-weight:600;color:#a0f4da;overflow-wrap:anywhere}"],["\u003csmall>親子GT研究所 / クラウド記録 v0.5（独立ポイント台帳）\u003c/small>\n\u003c/header>","\u003csmall>親子GT研究所 / クラウド記録 v0.6（航空・衛星写真切り替え）\u003c/small>\n\u003c/header>"],["\u003cp id=\"point-count\">登録ポイント：0 件\u003c/p>","\u003cp class=\"note\">地図を開くと、通常地図と航空・衛星画像を切り替えられるようになったぞ。\u003c/p>\n\u003cp id=\"point-count\">登録ポイント：0 件\u003c/p>"],[" \u003cdiv id=\"point-map\" aria-label=\"ポイント管理地図\">\u003c/div>"," \u003cdiv class=\"map-mode-tools\" role=\"group\" aria-label=\"ポイント地図の表示切り替え\">\n  \u003cbutton type=\"button\" data-map-mode=\"normal\" class=\"active\" aria-pressed=\"true\">🗺️ 通常地図\u003c/button>\n  \u003cbutton type=\"button\" data-map-mode=\"photo\" aria-pressed=\"false\">🛰️ 航空・衛星写真\u003c/button>\n \u003c/div>\n \u003cp class=\"photo-note\" id=\"point-photo-note\" hidden>写真表示では自動的に拡大するよ。撮影時期・画質は地域ごとに違う。写真がない場所は通常地図が見えるよ。\u003c/p>\n \u003cdiv id=\"point-map\" aria-label=\"ポイント管理地図\">\u003c/div>"],[" \u003cdiv id=\"trip-map\" aria-label=\"奄美大島の釣り場選択地図\">\u003c/div>"," \u003cdiv class=\"map-mode-tools\" role=\"group\" aria-label=\"釣行地図の表示切り替え\">\n  \u003cbutton type=\"button\" data-map-mode=\"normal\" class=\"active\" aria-pressed=\"true\">🗺️ 通常地図\u003c/button>\n  \u003cbutton type=\"button\" data-map-mode=\"photo\" aria-pressed=\"false\">🛰️ 航空・衛星写真\u003c/button>\n \u003c/div>\n \u003cp class=\"photo-note\" id=\"trip-photo-note\" hidden>写真表示では自動的に拡大するよ。撮影時期・画質は地域ごとに違う。写真がない場所は通常地図が見えるよ。\u003c/p>\n \u003cdiv id=\"trip-map\" aria-label=\"奄美大島の釣り場選択地図\">\u003c/div>"],["let selectedTripPointId=null;","let tripPhotoLayer=null;\nlet registryPhotoLayer=null;\nlet basemapMode='normal';\nlet selectedTripPointId=null;"],["function validPoint(p){return p && typeof p.lat==='number' && typeof p.lng==='number' && Number.isFinite(p.lat) && Number.isFinite(p.lng) && p.lat>=-90 && p.lat\u003c=90 && p.lng>=-180 && p.lng\u003c=180;}","// 国土地理院の全国最新写真（シームレス）。z14～18で配信されます。\n// 出典の明示と地理院タイル一覧へのリンクを表示。\n// 配信画像にはNASA/USGSやAxelspaceの衛星画像が含まれる場合があります。\nfunction createPhotoLayer(){\n return L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',{\n  minZoom:14,maxNativeZoom:18,maxZoom:19,\n  attribution:'写真：\u003ca href=\"https://maps.gsi.go.jp/development/ichiran.html\" target=\"_blank\" rel=\"noopener\">国土地理院\u003c/a>（一部 NASA/USGS・© Axelspace Corporation 等）'\n });\n}\nfunction applyBasemapMode(map,photoLayer){\n if(!map||!photoLayer)return;\n if(basemapMode==='photo'){\n  // 標準の初期ズーム10では写真は提供されないため、切り替え時に拡大。\n  if(map.getZoom()\u003c14)map.setZoom(14);\n  if(!map.hasLayer(photoLayer))photoLayer.addTo(map);\n }else if(map.hasLayer(photoLayer))map.removeLayer(photoLayer);\n}\nfunction refreshBasemapButtons(){\n document.querySelectorAll('[data-map-mode]').forEach(btn=>{\n  const active=btn.dataset.mapMode===basemapMode;\n  btn.classList.toggle('active',active);\n  btn.setAttribute('aria-pressed',String(active));\n });\n $('point-photo-note').hidden=basemapMode!=='photo';\n $('trip-photo-note').hidden=basemapMode!=='photo';\n}\ndocument.querySelectorAll('[data-map-mode]').forEach(btn=>btn.addEventListener('click',()=>{\n basemapMode=btn.dataset.mapMode;\n refreshBasemapButtons();\n applyBasemapMode(registryMap,registryPhotoLayer);\n applyBasemapMode(tripMap,tripPhotoLayer);\n}));\nrefreshBasemapButtons();\nfunction validPoint(p){return p && typeof p.lat==='number' && typeof p.lng==='number' && Number.isFinite(p.lat) && Number.isFinite(p.lng) && p.lat>=-90 && p.lat\u003c=90 && p.lng>=-180 && p.lng\u003c=180;}"],["  tripMap.on('click',event=>{","  tripPhotoLayer=createPhotoLayer();\n  applyBasemapMode(tripMap,tripPhotoLayer);\n  tripMap.on('click',event=>{"],["  registryPins=L.layerGroup().addTo(registryMap);","  registryPhotoLayer=createPhotoLayer();\n  applyBasemapMode(registryMap,registryPhotoLayer);\n  registryPins=L.layerGroup().addTo(registryMap);"]];
 for(const [needle,replacement] of patches){
   if(html.split(needle).length!==2)throw Error('v0.5とv0.6の差分が一致しません');
   html=html.replace(needle,replacement);
 }
 if(!html.includes('function createPhotoLayer'))throw Error('航空写真機能の組み込み失敗');
 document.open();document.write(html);document.close();
})().catch(e=>{document.getElementById('status').textContent='読み込みエラー：'+e.message+'。v0.5はそのまま使えます。';});
</script></body></html>
